# 설정 전체 설명: docs/study/02-backend-skeleton.md
spring:
  application:
    name: backend
  config:
    # 저장소 루트의 .env를 읽는다. Gradle/IDE가 backend/에서 실행되므로 ../.env. 파일이 없으면(CI·운영) 무시한다.
    import: optional:file:../.env[.properties]
  datasource:
    # :뒤는 값이 없을 때의 기본값. .env가 없는 CI에서도 설정을 읽을 수 있게 하려는 것(테스트는 Testcontainers가 접속 정보를 덮어씀).
    url: ${DB_URL:jdbc:mysql://localhost:3307/lol_inhouse}
    username: ${MYSQL_USER:lol_app}
    password: ${MYSQL_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
