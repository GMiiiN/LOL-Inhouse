# 설정 전체
spring:
  application:
    name: backend
  config:
    # 저장소 루트의 .env를 읽는다. Gradle/IDE가 backend/에서 실행되므로 ../.env. 파일이 없으면(CI·운영) 무시한다.
    import: optional:file:../.env[.properties]
  datasource:
    # :뒤는 값이 없을 때의 기본값. .env가 없는 CI에서도 설정을 읽을 수 있게 하려는 것(테스트는 Testcontainers가 접속 정보를 덮어씀).
    url: ${DB_URL:jdbc:mysql://localhost:3307/lol_inhouse}
    username: ${MYSQL_USER:lol_app}
    password: ${MYSQL_PASSWORD:}
    hikari:
      # 드라이버와 세션 시간대를 UTC로 맞춘다(URL 출처와 무관하게 적용). DATETIME(6)은 UTC로만 읽고 쓴다. 설명: ADR 005
      data-source-properties:
        connectionTimeZone: UTC
        forceConnectionTimeZoneToSession: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      # 결과창 이미지 업로드 상한(M4). 요청 전체는 폼 필드 여유분 1MB를 더한다. 설명: docs/design/m4-design.md §5
      max-file-size: 10MB
      max-request-size: 11MB

server:
  shutdown: graceful
  tomcat:
    # 상한을 넘은 업로드를 Tomcat이 끝까지 읽어 버리는 한도(기본 2MB). 이보다 크면 413 대신 연결이 끊긴다. request 상한보다 크게 둔다.
    max-swallow-size: 12MB
  servlet:
    session:
      # 담당자 로그인 세션 유지 시간(마지막 요청 기준). 설명: docs/design/m3-design.md §4
      timeout: 2h
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        # 운영(HTTPS)에서만 true. 로컬 http에서는 false여야 쿠키가 저장된다.
        secure: ${COOKIE_SECURE:false}

# 담당자 계정 초기값. DB에 계정이 없을 때만 한 번 읽어 만든다(비어 있으면 기동 실패 규칙은 auth 패키지).
app:
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

  # M4 추출 파이프라인 설정. 설명: docs/design/m4-design.md §2·§5·§11
  gemini:
    # API 키는 여기 쓰지 않는다. 코드가 @Value("${GEMINI_API_KEY:}")로 환경변수에서 읽는다.
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    request-timeout: 90s    # 요청 하나의 상한(실제 적용값 = min(이 값, 작업 마감까지 남은 시간))
    max-attempts: 4         # 일시 오류(408·429·5xx) 재시도 포함 총 시도 횟수
    job-deadline: 5m        # RUNNING 선점부터 작업 전체의 마감
  image-store:
    # 업로드 이미지 저장 위치. 친구 닉네임이 담겨 있어 data/는 git 제외. M7에서 S3 구현으로 교체
    local-dir: ${IMAGE_STORE_DIR:../data/images}
  ddragon:
    cache-dir: ${DDRAGON_CACHE_DIR:../data/ddragon}
    refresh-interval: 12h   # 최신 버전 확인 주기
  extraction:
    max-image-bytes: 10485760   # 10MB
    max-image-side: 4096        # 가로·세로 상한(압축 폭탄 방지)
    stale-after: 10m            # 조회 시 RUNNING이 이보다 오래되면 TIMEOUT 처리
    queued-expire-after: 10m    # 조회 시 QUEUED가 이보다 오래되면 EXPIRED 처리
    # margin(1순위-2순위 점수)이 이보다 작으면 uncertain(확인 화면에서 강조).
    # 2026-10-20 실제 결과창 1장 기준: 틀린 밴은 margin 0~0.007, 맞은 칸 대부분은 0.01 이상 → 0.01. 사용하며 조정한다.
    uncertain-margin: 0.01

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    # Hibernate가 SQL 오류 원문(닉네임 키 포함)을 로그에 남기지 않게 한다. 설명: docs/design/m4-design.md §11.2-9
    org.hibernate.orm.jdbc.error: "OFF"
