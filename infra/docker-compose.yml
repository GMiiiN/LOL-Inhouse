# 로컬 개발용 MySQL. 실행: docker compose -f infra/docker-compose.yml --env-file .env up -d
# 값(DB 이름·계정·비밀번호)은 루트 .env에서 읽는다. 설명: docs/study/01-repository-skeleton.md
name: lol-inhouse

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 호스트 포트는 .env의 MYSQL_HOST_PORT(기본 3307). PC에 설치된 MySQL이 3306을 쓰고 있어 충돌을 피한다.
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
