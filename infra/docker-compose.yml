# 로컬 개발용 MySQL. 실행: docker compose -f infra/docker-compose.yml --env-file .env up -d
# 값(DB 이름·계정·비밀번호)은 루트 .env에서 읽는다. 설명: docs/study/01-repository-skeleton.md
name: lol-inhouse

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 호스트 포트는 .env의 MYSQL_HOST_PORT(기본 3307). PC에 설치된 MySQL이 3306을 쓰고 있어 충돌을 피한다.
      # 127.0.0.1에만 열어 같은 네트워크의 다른 PC가 개발 DB에 접속하지 못하게 한다.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 앱 계정으로 TCP 접속해 대상 DB에 쿼리가 되는지 본다. mysqladmin ping은 인증 실패나
      # 초기화용 임시 서버에도 성공해서 "앱이 접속할 준비가 됨"을 보장하지 못한다. $$는 compose 변수 치환을 막는 이스케이프.
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
