# 역할: 데스크탑 운영의 입구. 프런트 정적 파일 + /api를 backend로 전달하고, 터널이 붙인 실제 접속 주소를 복원한다. 설명: docs/design/m55-design.md D5·D6

# 터널은 같은 PC(루프백)나 Docker 내부에서 붙으므로 사설·루프백 대역이 보낸 X-Forwarded-For만 믿는다.
# real_ip_recursive on: 오른쪽부터 읽어 신뢰 대역이 아닌 첫 주소를 접속자로 본다(클라이언트가 왼쪽에 넣은 가짜 값은 무시).
set_real_ip_from 127.0.0.1;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# 터널이 보낸 X-Forwarded-Proto가 있으면 그대로, 없으면 이 연결의 스킴(HTTPS 여부를 앱의 Secure 쿠키 판단에 쓴다)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 업로드 상한 10MB + 폼 여유(앱 multipart 상한 11MB). 넘으면 앱이 아니라 nginx가 413으로 끊는다
    client_max_body_size 12m;

    # Docker 내장 DNS로 backend 주소를 10초마다 다시 조회한다. backend만 재생성돼 IP가 바뀌어도 502가 나지 않는다.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # 변수로 지정해야 요청 때마다 이름을 조회한다. URI 부분 없이 쓰면 원래 요청 경로·쿼리가 그대로 전달된다.
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        # 위에서 복원한 접속자 주소 하나로 덮어쓴다(들어온 값을 이어 붙이지 않는다)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # 업로드 전송·추출 응답 대기 여유
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA: 파일이 없으면 index.html (새로고침·직접 접속 경로)
    location / {
        try_files $uri /index.html;
    }
}
