# PR·push마다 백엔드와 프런트를 빌드·테스트한다
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # GitHub 러너에는 Docker가 있어 Testcontainers MySQL 테스트가 그대로 돈다. .env는 없다.
      # build = 컴파일 + 테스트 + 실행 jar 패키징(bootJar). 배포 산출물이 실제로 만들어지는지까지 확인한다.
      # TEST_TZ: 로컬(서울)과 다른 JVM 시간대(UTC)에서도 시간 저장·조회가 같은지 확인한다
      - run: ./gradlew build --console=plain
        env:
          TEST_TZ: UTC

  extraction-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/extraction-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # 단위 테스트만. 실제 Gemini 호출(run)은 키·샘플이 필요해 CI에서 돌리지 않는다.
      - run: ./gradlew test --console=plain

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
